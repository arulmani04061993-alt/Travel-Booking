<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Lost in Paradise | STACKLY Travel</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #d4af37;
      --accent-gradient: linear-gradient(135deg, #d4af37 0%, #f59e0b 100%);
      --text-muted: #94a3b8;
      --radius-full: 9999px;
      --radius-md: 16px;
      --radius-lg: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0a0f1d 100%);
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Ambient luxury glow background */
    body::before {
      content: '';
      position: absolute;
      top: 20%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(0, 194, 255, 0.12) 0%, rgba(212, 175, 55, 0.08) 50%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      filter: blur(40px);
    }

    /* Main Content Wrapper */
    .content-center-wrapper {
      flex: 1;
      height: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 24px;
      z-index: 10;
      overflow: hidden;
    }

    /* 404 Hero Container */
    .error-card {
      max-width: 720px;
      width: 100%;
      text-align: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 48px 32px;
      border-radius: var(--radius-lg);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .error-compass-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(212, 175, 55, 0.12);
      border: 2px solid var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 2.2rem;
      margin-bottom: 20px;
      animation: compassSpin 20s linear infinite;
    }

    @keyframes compassSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .error-code {
      font-family: 'Playfair Display', serif;
      font-size: 7.2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 45%, #ff007f 80%, #ffaa00 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 5s ease infinite alternate;
      filter: drop-shadow(0 8px 30px rgba(0, 210, 255, 0.45));
      margin-bottom: 12px;
    }

    @keyframes gradientFlow {
      0% {
        background-position: 0% 50%;
      }

      100% {
        background-position: 100% 50%;
      }
    }

    .error-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.1rem;
      font-weight: 700;
      margin-bottom: 14px;
      color: #ffffff;
    }

    .error-desc {
      font-size: 1rem;
      color: var(--text-muted);
      line-height: 1.65;
      max-width: 560px;
      margin: 0 auto 28px auto;
    }

    /* Actions */
    .action-group {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 13px 28px;
      border-radius: var(--radius-full);
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #0b1120;
      box-shadow: 0 8px 25px rgba(212, 175, 55, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.5);
    }

    .btn-outline {
      background: transparent;
      color: #ffffff;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: #ffffff;
      transform: translateY(-2px);
    }

    @media (max-width: 640px) {
      .content-center-wrapper {
        padding: 16px;
      }

      .error-card {
        padding: 28px 18px;
      }

      .error-compass-icon {
        width: 64px;
        height: 64px;
        font-size: 1.8rem;
        margin-bottom: 12px;
      }

      .error-code {
        font-size: 4rem;
        margin-bottom: 8px;
      }

      .error-title {
        font-size: 1.4rem;
        margin-bottom: 10px;
      }

      .error-desc {
        font-size: 0.9rem;
        margin-bottom: 20px;
        line-height: 1.5;
      }

      .action-group {
        gap: 12px;
      }

      .action-group .btn {
        width: 100%;
        justify-content: center;
        padding: 11px 20px;
      }
    }
  </style>
</head>

<body>

  <!-- Main Content Area -->
  <div class="content-center-wrapper">
    <main class="error-card">
      <div class="error-compass-icon">
        <i class="fa-regular fa-compass"></i>
      </div>

      <div class="error-code">404</div>
      <h1 class="error-title">Destination Not Found</h1>
      <p class="error-desc">
        It appears your navigation compass wandered off the luxury grid! The retreat, villa, or route you are searching
        for is currently unmapped or booked out.
      </p>

      <!-- Buttons -->
      <div class="action-group">
        <button type="button" class="btn btn-primary" onclick="history.back()">
          <i class="fa-solid fa-arrow-left"></i> Go back
        </button>
        <a href="index.html" class="btn btn-outline">
          <i class="fa-solid fa-house"></i> Go to Home
        </a>
      </div>
    </main>
  </div>
</body>

</html>
